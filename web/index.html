  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A lightwaight mobile pos system for a affordable price">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="POS Podda">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- SEO Meta Tags -->
  <meta name="description"
    content="POS Podda is Sri Lanka's best free Point of Sale (POS) system for small businesses. Manage inventory, sales, and billing easily. Download now!">
  <meta name="keywords"
    content="pos, pos system, point of sales, sri lanka pos, pos podda, free pos software, retail pos, inventory management, billing software">
  <meta name="author" content="POS Podda">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://pos-podda.web.app/">
  <meta property="og:title" content="POS Podda - Best Free POS System in Sri Lanka">
  <meta property="og:description"
    content="Manage your shop with ease using POS Podda. Free inventory, sales, and billing system optimized for mobile and tablet.">
  <meta property="og:image" content="https://pos-podda.web.app/icons/Icon-192.png">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://pos-podda.web.app/">
  <meta property="twitter:title" content="POS Podda - Best Free POS System in Sri Lanka">
  <meta property="twitter:description"
    content="Manage your shop with ease using POS Podda. Free inventory, sales, and billing system optimized for mobile and tablet.">
  <meta property="twitter:image" content="https://pos-podda.web.app/icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>POS Podda</title>
  <link rel="manifest" href="manifest.json">
  <meta name="google-site-verification" content="TDC6WNr8TdBKxuvsVwPfmRtJT8jIHbLLT2j3diyUEdo" />
</head>

<body>
  <!-- Canvas Kit Placeholder -->

  <!-- Custom Splash Screen -->
  <div id="loading"
    style="position: fixed; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background-color: #132148; z-index: 9999; flex-direction: column;">
    <img src="splash.png" alt="POS Podda"
      style="width: 150px; height: 150px; object-fit: contain; margin-bottom: 24px;">
    <div class="loader"
      style="border: 3px solid rgba(255,255,255,0.15); border-top: 3px solid #00E5FF; border-radius: 50%; width: 28px; height: 28px; animation: spin 0.8s linear infinite;">
    </div>
  </div>

  <style>
    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    /* Dark Mode Support */
    @media (prefers-color-scheme: dark) {
      #loading {
        background-color: #132148 !important;
      }
    }
  </style>

  <script>
    window.addEventListener('load', function () {
      var observer = new MutationObserver(function (mutations) {
        if (document.querySelector('flt-glass-pane')) {
          var loading = document.getElementById('loading');
          if (loading) {
            loading.style.opacity = '0';
            setTimeout(function () { loading.remove(); }, 500);
          }
          observer.disconnect();
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
