name: Deploy POS Podda Web to Firebase

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Ensure only one deploy runs at a time to prevent race conditions
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  test_build_and_deploy:
    name: Build & Deploy to Firebase Hosting
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_POS_PODDA }}
      FIREBASE_CLI_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🐦 Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install Flutter Dependencies
        run: flutter pub get

      - name: 🧪 Run Automated Tests
        run: flutter test

      - name: 🔨 Build Flutter Web (Production Release)
        run: flutter build web --release --no-wasm-dry-run

      - name: 🚀 Deploy to Firebase Hosting (Service Account)
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_POS_PODDA }}"
          channelId: live
          projectId: pos-podda

      - name: 🚀 Deploy to Firebase Hosting (Token Fallback)
        if: env.FIREBASE_SERVICE_ACCOUNT == '' && env.FIREBASE_CLI_TOKEN != ''
        run: npx firebase-tools deploy --only hosting --token "${{ secrets.FIREBASE_TOKEN }}"

      - name: ⚠️ Deployment Notice (Missing Secrets)
        if: env.FIREBASE_SERVICE_ACCOUNT == '' && env.FIREBASE_CLI_TOKEN == ''
        run: |
          echo "::warning::Firebase deployment credentials not configured yet in GitHub Secrets."
          echo "Build and tests succeeded! To enable automatic deployment to Firebase, add 'FIREBASE_SERVICE_ACCOUNT_POS_PODDA' or 'FIREBASE_TOKEN' in GitHub Repository Settings -> Secrets and variables -> Actions."
