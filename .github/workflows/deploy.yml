name: POS Podda CI validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Test and build without production credentials
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Set up Java 17 for the Firestore Emulator
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up pinned Flutter SDK
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.35.6'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter application
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build Flutter Web without deployment credentials
        run: flutter build web --release --no-wasm-dry-run

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Test Cloud Functions validation
        run: npm test --prefix functions

      - name: Audit production Functions dependencies
        run: npm audit --prefix functions --omit=dev --audit-level=moderate

      - name: Install Firestore rules test dependencies
        run: npm ci --prefix tests/firestore

      - name: Run Firestore Emulator rules tests
        run: npm test --prefix tests/firestore
